<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9dfcd"><link rel="icon" href="data:,"><title>邓知蕾 · A room of my own</title><link rel="stylesheet" href="experience.css"></head>
<body data-interaction-phase="overview">
<div id="scene" aria-label="可探索的三维个人空间"></div>
<header class="room-header"><a href="./index.html" class="identity">邓知蕾<span>A ROOM OF MY OWN</span></a><button id="day-night" aria-pressed="false">☀ Day</button></header>
<div id="bubbles"></div><footer class="room-hint">拖动探索 · 点击物件走近它</footer>
<button id="return-room" hidden>← 返回房间 <small>Esc</small></button>
<div id="experience" role="dialog" aria-modal="true" aria-label="物件体验" hidden><div id="experience-content"></div></div>
<p id="status" role="status">正在打开房间…</p>
<script src="three.min.js"></script><script src="OrbitControls.js"></script><script src="libs/GLTFLoader.js"></script><script src="libs/DRACOLoader.js"></script>
<script src="environment.js"></script><script src="room.js"></script><script src="content-store.js"></script><script src="camera-controller.js"></script><script src="interaction-bubble.js"></script><script src="experiences.js"></script><script src="interactions.js"></script>
<script>
(async()=>{try{
const content=await ContentStore.load();
const mobile=innerWidth<700;
const app=RoomBuilder.build(document.getElementById('scene'),RoomBuilder.loadLayout(),{fov:mobile?57:49,camPos:mobile?[17,12,21]:[11.5,7.5,12],target:[3.6,1.65,2.3],maxDistance:mobile?32:20});
window.__ROOM_APP__=app;Interactions.init(app,content);document.getElementById('status').hidden=true;
}catch(error){document.getElementById('status').textContent='房间暂时无法打开，请刷新重试。';console.error(error);}})();
</script></body></html>
